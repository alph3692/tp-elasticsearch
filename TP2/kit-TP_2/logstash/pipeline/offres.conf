# Atelier 1 : recharger data/offres.ndjson dans l'index "offres" du TP.

input {
  file {
    path => "/data/offres*.ndjson"
    # TODO 1 : lecture complète, une seule fois (pas de suivi continu comme en "tail")
    mode => "read"
    # TODO 2 : une ligne = un objet JSON = un événement
    codec => "json"
    # TODO 3 : pas de mémoire de position, le fichier est relu à chaque démarrage (labo)
    sincedb_path => "/dev/null"
    # TODO 4 : ne pas supprimer le fichier après lecture (défaut "delete"), noter son nom
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/offres_lus.log"
  }
}

filter {
  # TODO 6 : champs ajoutés par Logstash, refusés par "dynamic": "strict"
  mutate {
    remove_field => ["@timestamp", "@version", "event", "log", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    # TODO 5 : index cible, _id métier, action, pas de data stream, pas de template
    index => "offres"
    document_id => "%{id}"
    action => "index"
    data_stream => "false"
    manage_template => false
  }
}
