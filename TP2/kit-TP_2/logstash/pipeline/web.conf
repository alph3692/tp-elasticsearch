# Partie 3 : logs d'accès du site de recrutement -> data stream logs-web-default.
input {
  file {
    path => "/data/access.log"
    mode => "read"
    sincedb_path => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/web_lus.log"
  }
}

filter {
  # TODO 1 : découper la ligne Apache combined en champs ECS
  grok {
    match => { "message" => "%{COMBINEDAPACHELOG}" }
  }

  if "_grokparsefailure" not in [tags] {
    # TODO 2 : dater l'événement avec l'heure de la REQUÊTE, pas celle de la lecture
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      locale => "en"                                # mois en anglais : Sep
      remove_field => ["timestamp"]                 # supprimé seulement si la date est valide
    }

    # TODO 3 : décomposer le navigateur (user_agent.name, .os.name, .device.name...)
    useragent {
      source => "[user_agent][original]"
      target => "[user_agent]"
    }

    # TODO 4 : identifiant d'offre pour /offres/OFF-01468 et /offres/OFF-01468/postuler
    if [url][original] =~ /^\/offres\/OFF-/ {
      grok {
        pattern_definitions => { "OFFRE_ID" => "OFF-[0-9]{5}" }
        match => { "[url][original]" => "^/offres/%{OFFRE_ID:[labels][offre_id]}" }
        tag_on_failure => ["_offre_id_failure"]
      }
    }

    # TODO 5 : la ligne brute est déjà dans "message" : inutile de la stocker deux fois
    mutate { remove_field => ["[event][original]"] }
  }

  # Ex. 3.5, solution 2 (à décommenter APRÈS avoir constaté les doublons) :
  # identifiant calculé à partir du contenu de la ligne -> rejeu sans doublon
  fingerprint {
     source => "message"
     target => "[@metadata][fingerprint]"
     method => "SHA256"
   }
}

output {
  # TODO 6 : data stream logs-web-default (type-dataset-namespace)
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "web"
    data_stream_namespace => "default"
    document_id => "%{[@metadata][fingerprint]}" # ex. 3.5 : ligne rejouée -> 409 conflit, ignorée
  }
}
